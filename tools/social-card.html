<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Berkeley Red Devils sharing artwork source</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body { display: flex; flex-direction: column; background: #fff; color: #202020; font-family: Arial, sans-serif; border-top: 12px solid #b80808; }
      main { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
      img { display: block; width: 880px; height: 294px; object-fit: contain; }
      h1 { margin: 0; font-size: 38px; letter-spacing: 2px; }
      p { margin: 0; font-size: 25px; color: #4c4c4c; }
      footer { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; background: #b80808; color: white; font-size: 23px; }
      footer strong { font-size: 20px; letter-spacing: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="../public/images/berkeley-red-devils-wordmark.png" alt="Berkeley Red Devils" />
      <h1>AAU YOUTH BASKETBALL</h1>
      <p>Player development · Teams ages 9–14</p>
    </main>
    <footer>
      <strong>BERKELEY + BAY AREA</strong>
      <span>reddevilsaau.com</span>
    </footer>
  </body>
</html>
